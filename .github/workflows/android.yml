
name: Build SIYA Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android Project
        run: |
          mkdir android-src
          unzip -q SIYA_Android_Project_Mobile_Build.zip -d android-src

      - name: Build APK
        run: |
          cd android-src/SIYA_Android_Studio_Project
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SIYA-Daily-Report-APK
          path: android-src/SIYA_Android_Studio_Project/app/build/outputs/apk/debug/app-debug.apk
