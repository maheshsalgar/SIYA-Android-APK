name: Build SIYA APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Capacitor project
        run: |
          mkdir -p www
          cp index.html www/index.html
          cat > package.json <<'EOF'
          {
            "name": "siya-daily-report",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.2.0",
              "@capacitor/cli": "^6.2.0",
              "@capacitor/core": "^6.2.0",
              "@capacitor/filesystem": "^6.0.0",
              "@capacitor/share": "^6.0.0"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.siya.dailyreport",
            "appName": "SIYA Daily Report",
            "webDir": "www"
          }
          EOF
          npm install
          npx cap add android
          sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/><uses-permission android:name="android.permission.CAMERA"/><application#' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Add SIYA logo as app icon
        run: |
          LOGO=$(ls -1 *.png 2>/dev/null | head -n 1)
          if [ -z "$LOGO" ]; then echo "No logo png found - default icon will be used"; exit 0; fi
          echo "Using logo: $LOGO"
          R=android/app/src/main/res
          for entry in "mdpi 48 108" "hdpi 72 162" "xhdpi 96 216" "xxhdpi 144 324" "xxxhdpi 192 432"; do
            set -- $entry
            D=$R/mipmap-$1
            mkdir -p "$D"
            convert "$LOGO" -resize $2x$2 "$D/ic_launcher.png"
            convert "$LOGO" -resize $2x$2 "$D/ic_launcher_round.png"
            IN=$(( $3 * 72 / 100 ))
            convert -size $3x$3 xc:none \( "$LOGO" -resize ${IN}x${IN} \) -gravity center -composite "$D/ic_launcher_foreground.png"
          done
          echo '<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#000000</color></resources>' > $R/values/ic_launcher_background.xml

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Keep APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: siya-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK in Releases (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: SIYA APK ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
